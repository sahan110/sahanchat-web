<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SahanChat — Somali • Global</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-logo">S</div>

      <div>
        <strong>SahanChat</strong>
        <small>Somali • Global</small>
      </div>
    </div>

    <div class="menu">

      <p class="menu-label">MAIN</p>

      <button class="nav-btn active" data-page="home">
        🏠 <span>Home</span>
      </button>

      <button class="nav-btn" data-page="messages">
        💬 <span>Messages</span>
      </button>

      <button class="nav-btn" data-page="community">
        👥 <span>Community</span>
      </button>

      <button class="nav-btn" data-page="videos">
        🎥 <span>Videos</span>
      </button>

      <button class="nav-btn" data-page="live">
        🔴 <span>Live</span>
      </button>

      <button class="nav-btn" data-page="status">
        📢 <span>Status</span>
      </button>

      <button class="nav-btn" data-page="discover">
        🌍 <span>Discover</span>
      </button>


      <p class="menu-label">CREATOR</p>

      <button class="nav-btn" data-page="wallet">
        🪙 <span>SahanWallet</span>
      </button>

      <button class="nav-btn" data-page="creator">
        🎥 <span>Creator Center</span>
      </button>


      <p class="menu-label">SYSTEM</p>

      <button class="nav-btn" data-page="settings">
        ⚙️ <span>Settings</span>
      </button>

      <button class="nav-btn" data-page="help">
        ❓ <span>Help & Support</span>
      </button>

    </div>

    <div class="sidebar-user">

      <div class="avatar green">A</div>

      <div>
        <strong>@Ahmed</strong>
        <small>🟢 Online</small>
      </div>

    </div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <header class="topbar">

      <div>
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <strong id="pageTitle">Home</strong>
      </div>

      <div class="top-actions">

        <button id="notificationBtn">🔔</button>

        <button data-page="settings" class="quick-settings">
          ⚙️
        </button>

      </div>

    </header>


    <!-- CONTENT -->
    <div id="content"></div>


  </main>


  <!-- MOBILE NAV -->
  <nav class="mobile-nav">

    <button data-page="home" class="mobile-active">
      🏠
      <small>Home</small>
    </button>

    <button data-page="messages">
      💬
      <small>Chat</small>
    </button>

    <button data-page="community">
      👥
      <small>Community</small>
    </button>

    <button data-page="videos">
      🎥
      <small>Videos</small>
    </button>

    <button data-page="settings">
      ⚙️
      <small>Settings</small>
    </button>

  </nav>

</div>


<!-- TOAST -->
<div id="toast" class="toast"></div>


<script src="app.js"></script>

</body>
                       </html>
